version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freellmhub-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/freellmhub?schema=public
      - AUTH_SECRET=your-super-secret-jwt-key-minimum-32-chars
      - ENCRYPTION_SECRET=your-32-character-aes-encryption-key-for-secrets
      - DEFAULT_ADMIN_EMAIL=admin@freellmhub.dev
      - DEFAULT_ADMIN_PASSWORD=admin_secure_password_123
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: freellmhub-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: freellmhub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freellmhub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
